# Main deployment owns exactly app + gateway. Data/worker lifecycles are external.
services:
  app:
    image: ${APP_IMAGE:-nesomn-app:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      PORT: 3000
      STORAGE_PATH: /data/storage
    expose: ['3000']
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 30s
    volumes:
      - storage:/data/storage
    networks: [web, data]

  gateway:
    image: nginx:1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    user: nginx
    # Skip image init scripts: config is read-only and listens on 8080.
    entrypoint: [nginx, '-g', 'daemon off;']
    ports:
      - '${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/trusted-proxies.conf:/etc/nginx/trusted-proxies.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8080/health/live >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [web]

networks:
  web:
  data:
    external: true
    name: ${DATA_NETWORK:-nesomn-data-network}

volumes:
  storage:
    external: true
    name: ${STORAGE_VOLUME:-nesomn-storage}
