worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;
    log_format redacted '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout redacted;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    geo $trusted_proxy { default 0; include /etc/nginx/trusted-proxies.conf; }
    map "$trusted_proxy:$http_x_forwarded_proto" $public_scheme {
        default $scheme;
        '1:https' https;
        '1:http' http;
    }
    map "$trusted_proxy:$http_x_forwarded_for" $client_ip {
        default $remote_addr;
        ~^1:([0-9a-fA-F:.]+)$ $1;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 110m;
        client_body_timeout 120s;
        add_header X-Content-Type-Options nosniff always;

        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $app_backend app:3000;
            proxy_pass http://$app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header Forwarded '';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
